name: Build and Release Valkey Windows

on:
  push:
    tags:
      - 'v*'
      - '9.*'
      - '8.*'
      - '7.*'
      - '[0-9]+.*'
      - '*unstable*'
  schedule:
    - cron: '0 0 * * 0' # Weekly check for new releases
  workflow_dispatch:
    inputs:
      version:
        description: 'Valkey tag, branch, or SHA to build'
        required: false
        default: 'unstable'
      valkey_ref:
        description: 'Alias for version'
        required: false

permissions:
  contents: write

jobs:
  check-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check latest upstream release
        id: check
        run: |
          LATEST_UPSTREAM=$(curl -s https://api.github.com/repos/valkey-io/valkey/releases/latest | jq -r .tag_name)
          if [ "$LATEST_UPSTREAM" == "null" ] || [ -z "$LATEST_UPSTREAM" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LATEST_LOCAL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST_UPSTREAM | jq -r .tag_name)

          if [ "$LATEST_LOCAL" == "$LATEST_UPSTREAM" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_UPSTREAM" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check-upstream]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && needs.check-upstream.outputs.should_build == 'true'))
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version || github.event.inputs.valkey_ref || needs.check-upstream.outputs.version || github.ref_name }}
    steps:
      - name: Checkout Build Scripts
        uses: actions/checkout@v7
        with:
          path: build-repo

      - name: Determine Upstream Ref
        id: determine_ref
        run: |
          $ref = $env:VERSION
          if ($ref -match '^v(?<version>\d.*)') {
              $ref = $Matches.version
          } elseif ($ref -match 'unstable') {
              $ref = 'unstable'
          }
          echo "UPSTREAM_REF=$ref" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Checkout Valkey
        uses: actions/checkout@v7
        with:
          repository: valkey-io/valkey
          ref: ${{ env.UPSTREAM_REF }}
          path: valkey

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          path: auto-win-msvc
        continue-on-error: true

      - name: Apply Windows Build Patch
        working-directory: valkey
        run: |
          git apply --ignore-whitespace ../build-repo/patches/0001-Windows-native-builds.patch

      - name: Prepare Windows Service Wrapper
        working-directory: valkey
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v3.0.0-alpha.11/WinSW-x64.exe" -OutFile "valkey-service.exe"
          Copy-Item "..\build-repo\packaging\valkey-service.xml" -Destination "valkey-service.xml"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Configure CPack Packaging
        working-directory: valkey
        run: |
          Copy-Item "COPYING" -Destination "COPYING.txt"
          Copy-Item -Recurse "..\build-repo\packaging" "..\packaging"

      - name: Configure CMake
        working-directory: valkey
        run: |
          $ErrorActionPreference = "Continue"
          cmake -G "Visual Studio 18 2026" -A x64 -B build_msvc2026 -S . 2> $null
          if ($LASTEXITCODE -ne 0) {
              cmake -G "Visual Studio 17 2022" -A x64 -B build_msvc2026 -S . 2> $null
              if ($LASTEXITCODE -ne 0) {
                  cmake -B build_msvc2026 -S .
                  if ($LASTEXITCODE -ne 0) {
                      Write-Error "CMake configuration failed."
                      exit 1
                  }
              }
          }
        shell: pwsh

      - name: Build Valkey
        working-directory: valkey
        run: cmake --build build_msvc2026 --config Release

      - name: Package with CPack
        working-directory: valkey/build_msvc2026
        run: cpack -C Release

      - name: E2E Testing
        working-directory: valkey
        shell: cmd
        run: |
          set SERVER_EXE=build_msvc2026\bin\Release\valkey-server.exe
          set CLI_EXE=build_msvc2026\bin\Release\valkey-cli.exe

          if not exist "%SERVER_EXE%" exit /b 1
          if not exist "%CLI_EXE%" exit /b 1

          echo Starting Valkey Server...
          start "Valkey Server" "%SERVER_EXE%"
          ping 127.0.0.1 -n 4 > nul

          echo Running tests...
          "%CLI_EXE%" PING > test_output.txt
          findstr "PONG" test_output.txt > nul || (type test_output.txt & taskkill /f /im valkey-server.exe & exit /b 1)

          "%CLI_EXE%" SET mykey "Hello Windows" > test_output.txt
          findstr "OK" test_output.txt > nul || (type test_output.txt & taskkill /f /im valkey-server.exe & exit /b 1)

          "%CLI_EXE%" GET mykey > test_output.txt
          findstr "Hello Windows" test_output.txt > nul || (type test_output.txt & taskkill /f /im valkey-server.exe & exit /b 1)

          "%CLI_EXE%" KEYS * > test_output.txt
          findstr "mykey" test_output.txt > nul || (type test_output.txt & taskkill /f /im valkey-server.exe & exit /b 1)

          "%CLI_EXE%" FLUSHDB > test_output.txt
          findstr "OK" test_output.txt > nul || (type test_output.txt & taskkill /f /im valkey-server.exe & exit /b 1)

          echo Tests passed!
          taskkill /f /im valkey-server.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Valkey-Windows-Binaries
          path: |
            valkey/build_msvc2026/Valkey-*.zip
            valkey/build_msvc2026/Valkey-*.msi
            valkey/build_msvc2026/Valkey-*.exe
            valkey/build_msvc2026/bin/Release/valkey-server.exe
            valkey/build_msvc2026/bin/Release/valkey-cli.exe

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (env.VERSION == 'unstable' && format('unstable-{0}', github.run_id) || env.VERSION) }}
          name: Valkey ${{ env.VERSION }} for Windows
          prerelease: ${{ contains(env.VERSION, 'unstable') || contains(env.VERSION, 'rc') || contains(env.VERSION, 'alpha') || contains(env.VERSION, 'beta') }}
          files: |
            valkey/build_msvc2026/Valkey-*.zip
            valkey/build_msvc2026/Valkey-*.msi
            valkey/build_msvc2026/Valkey-*.exe
            valkey/build_msvc2026/bin/Release/valkey-server.exe
            valkey/build_msvc2026/bin/Release/valkey-cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
